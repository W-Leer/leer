version: 2

updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/api
    schedule:
      interval: weekly
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: uv
    directory: /apps/sdk-python
    schedule:
      interval: weekly
    groups:
      sdk-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
