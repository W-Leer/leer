[project]
name = "leer"
version = "0.1.0"
description = "Python SDK for Leer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.2",
]

[tool.hatch.build.targets.wheel]
packages = ["leer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"