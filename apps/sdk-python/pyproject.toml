[project]
name = "leer"
version = "0.1.0"
description = "Python SDK for Leer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.2",
  # Real provider SDKs for contract tests (tests/test_real_sdk_contract.py).
  # Test-only: the wrappers duck-type clients and Leer never imports these at runtime.
  "openai>=3.41.0",
  "anthropic>=2.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["leer"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"